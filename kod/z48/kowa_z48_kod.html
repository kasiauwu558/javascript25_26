<textarea cols="80" rows="25">
<!DOCTYPE html>
<head>
    <title>Sprawdzenie danych Kowalewski </title>
    <meta charset="utf-8">
</head>
<body>
    <div style="color:red;font-size:50px;">
        <script language="JavaScript">
            do {
                var liczba1=prompt("wysokość=","");
                var h_kow=parseFloat(liczba1);
            } while (h_kow<=0);
            do {
                var liczba1=prompt("podstawę=","");
                var a_kow=parseFloat(liczba1);
            } while(!(a_kow>0));
            var Pole=a_kow*h_kow/2;
            document.write("Pole="+Pole.toFixed(2)+" cm^2"+"<br>");
        </script>
    </div>
</body>
</html>
</textarea>
</body>
