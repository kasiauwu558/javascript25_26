<!DOCTYPE html>
<head>
    <title>Kowalewski Z51_JS</title>
    <meta charset="utf-8">
</head>
<body>
    <div style="color:red;font-size:50px;">
        <script language="JavaScript">
            var silnia_kow = 1;
            var n_kow = parseInt(prompt("n = ",""));
            for (var i_kow = 1; i_kow<=n_kow; i_kow++){
                silnia_kow*=i_kow;
            }
            document.write(n_kow + "! = " + silnia_kow.toFixed(0));
        </script>
    </div>
</body>
