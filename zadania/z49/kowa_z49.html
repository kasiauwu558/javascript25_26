<!DOCTYPE html>
<head>
    <title>Kowalewski</title>
    <meta charset="utf-8">
</head>
<body>
    <div style="color:red;font-size:50px;">
        <script language="JavaScript"> //z49
            do {
                var a_kow=parseFloat(prompt("bok a=",""));
                var b_kow=parseFloat(prompt("bok b=",""));
                var c_kow=parseFloat(prompt("bok c=",""));
                document.write("sprawdzam waruni dla trójkąta wczytanych danych" + "<br>");
            } while (!((a_kow>0)&&(b_kow>0)&&(c_kow>0)&&(a_kow+b_kow>c_kow)&&(a_kow+c_kow>b_kow)&&(c_kow+b_kow>a_kow)));
            document.write("wyrok: trojkat sie zamyka oraz boki sa dodatnie");
        </script>
    </div>
</body>
</html>
