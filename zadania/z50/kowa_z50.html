<!DOCTYPE html>
<head>
    <title>Kowalewski Z50_JS</title>
    <meta charset="utf-8">
</head>
<body>
    <div style="color:red;font-size:50px;">
        <script language="JavaScript">
            var suma_kow = 0;
            for (var i_kow = 1; i_kow<=1000000; i_kow++){
                suma_kow = suma_kow + 1 / i_kow;
            }
            document.write("suma = " + suma_kow.toFixed(2));
        </script>
    </div>
</body>
</html>
