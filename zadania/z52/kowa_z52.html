<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title> Przykład użycia pętli </title>
    <script language="JavaScript">
        document.write("<p style='color: red; font-size: 2cm;'> Kowalewski </p>");
        document.write("<p style='color: blue; font-size: 5mm;'> Przykład użycia pętli </p>");
        for (var i_kow=1; i_kow<=10; i_kow++){
            for (var k_kow=1; k_kow<=i_kow; k_kow++){
                document.write("&nbsp");
            }
            document.write(i_kow+"<br>");
        }
    </script>
</head>
<body>
</body>
</html>
