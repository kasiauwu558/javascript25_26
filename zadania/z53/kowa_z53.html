<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title> Przykład użycia pętli </title>
    <script language="JavaScript">
        var a_kow = parseInt(prompt("ile razy powtórzyć=",""));
        var inicjaly_kow = prompt("podaj swoje inicjaly=","");
        document.write("<p style='color: red; font-size: 2cm;'> Kowalewski </p>");
        document.write("<p style='color: blue; font-size: 5mm;'> Przykład użycia pętli </p>");
        for (var i_kow=1; i_kow<=a_kow; i_kow++){
            for (var k_kow=1; k_kow<=i_kow; k_kow++){
                document.write("&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp&nbsp");
            }
            document.write(i_kow + "_" + inicjaly_kow + "_" + i_kow + "<br>");
        }
    </script>
</head>
<body>
</body>
</html>
